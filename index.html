<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS Obfuscator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05050a;--surface:rgba(12,13,22,.85);--surface2:rgba(18,19,30,.9);--surface3:rgba(24,26,42,.95);
  --border:rgba(255,255,255,.06);--border-hi:rgba(255,255,255,.1);
  --text:#e2e4f0;--text-dim:#6a7090;--text-faint:#3a3f58;
  --accent:#7c5cfc;--accent2:#a78bfa;--accent3:#c4b5fd;--accent-glow:rgba(124,92,252,.3);
  --green:#10b981;--green2:#34d399;--green-glow:rgba(16,185,129,.2);
  --red:#f43f5e;--red-glow:rgba(244,63,94,.15);
  --cyan:#38bdf8;--cyan-glow:rgba(56,189,248,.12);
  --amber:#f59e0b;
  --radius:16px;--radius-sm:10px;--radius-xs:6px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}

/* CANVAS BG */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* GRADIENT ORBS */
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
.orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(124,92,252,.08),transparent 70%);top:-200px;left:-100px;animation:orbFloat 25s ease-in-out infinite}
.orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(16,185,129,.06),transparent 70%);bottom:-150px;right:-100px;animation:orbFloat 30s ease-in-out infinite reverse}
.orb-3{width:350px;height:350px;background:radial-gradient(circle,rgba(56,189,248,.05),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:orbFloat 20s ease-in-out infinite 5s}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-30px)}50%{transform:translate(-20px,40px)}75%{transform:translate(30px,20px)}}

.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;padding:28px 36px 24px;backdrop-filter:blur(1px)}

/* HEADER */
.header{text-align:center;margin-bottom:32px;position:relative}
.header::after{content:'';position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);border-radius:1px}
.logo{display:inline-flex;align-items:center;gap:14px;margin-bottom:10px}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--accent),#9b5de5,#c084fc);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;letter-spacing:-1px;box-shadow:0 4px 24px var(--accent-glow),0 0 0 1px rgba(255,255,255,.1) inset;position:relative;overflow:hidden}
.logo-icon::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 50%);border-radius:14px}
.logo-icon::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.1),transparent);animation:logoSpin 6s linear infinite}
@keyframes logoSpin{to{transform:rotate(360deg)}}
h1{font-size:1.8rem;font-weight:900;letter-spacing:-.8px}
h1 .grad{background:linear-gradient(135deg,#fff 0%,var(--accent2) 40%,var(--cyan) 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.tagline{font-size:.85rem;color:var(--text-dim);font-weight:400;margin-top:6px;letter-spacing:.2px}

/* PROCESSING OVERLAY */
.processing{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,5,10,.8);backdrop-filter:blur(12px);align-items:center;justify-content:center;flex-direction:column;gap:20px}
.processing.active{display:flex}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.processing-text{font-size:.9rem;color:var(--text-dim);font-weight:500;letter-spacing:.5px}
.processing-steps{font-size:.72rem;color:var(--text-faint);font-family:'JetBrains Mono',monospace;text-align:center;line-height:1.8;min-height:80px}

/* MAIN CONTENT */
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}

.panel{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .25s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(20px);position:relative}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent)}
.panel:focus-within{border-color:rgba(124,92,252,.3);box-shadow:0 0 30px rgba(124,92,252,.06)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2);flex-shrink:0}
.panel-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);display:flex;align-items:center;gap:9px}
.panel-dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);transition:all .3s}
.panel-dot.on{background:var(--green);box-shadow:0 0 10px var(--green-glow)}
.panel-meta{font-size:.68rem;color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-weight:500}

/* DROP ZONE */
.drop-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 24px;cursor:pointer;transition:all .25s;position:relative;min-height:220px}
.drop-border{position:absolute;inset:18px;border:2px dashed var(--border);border-radius:var(--radius-sm);transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none}
.drop-area:hover .drop-border{border-color:rgba(124,92,252,.4);background:rgba(124,92,252,.02)}
.drop-area.drag-over .drop-border{border-color:var(--green);background:rgba(16,185,129,.03);border-style:solid;box-shadow:0 0 30px rgba(16,185,129,.05)}
.drop-area.has-file .drop-border{border-color:rgba(16,185,129,.3);border-style:solid;opacity:.5}
.drop-icon-wrap{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:16px;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative}
.drop-icon-wrap::after{content:'';position:absolute;inset:-4px;border-radius:22px;border:1px solid transparent;transition:border-color .3s}
.drop-area:hover .drop-icon-wrap{border-color:rgba(124,92,252,.4);background:rgba(124,92,252,.06);transform:translateY(-2px)}
.drop-area:hover .drop-icon-wrap::after{border-color:rgba(124,92,252,.15)}
.drop-area.drag-over .drop-icon-wrap{border-color:var(--green);background:rgba(16,185,129,.08);transform:translateY(-2px) scale(1.05)}
.drop-area.has-file .drop-icon-wrap{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.06)}
.drop-icon-wrap svg{width:26px;height:26px;stroke:var(--text-dim);fill:none;stroke-width:1.8;transition:all .3s}
.drop-area:hover .drop-icon-wrap svg{stroke:var(--accent2)}
.drop-area.drag-over .drop-icon-wrap svg{stroke:var(--green2)}
.drop-area.has-file .drop-icon-wrap svg{stroke:var(--green2)}
.drop-label{font-size:.88rem;font-weight:600;color:var(--text-dim);text-align:center;transition:color .3s}
.drop-area:hover .drop-label{color:var(--text)}
.drop-sub{font-size:.72rem;color:var(--text-faint);margin-top:5px;text-align:center}
.drop-fname{font-size:.8rem;font-weight:600;color:var(--green2);margin-top:12px;word-break:break-all;text-align:center;font-family:'JetBrains Mono',monospace;opacity:0;transform:translateY(6px);transition:all .3s}
.drop-area.has-file .drop-fname{opacity:1;transform:translateY(0)}
.drop-fsize{font-size:.68rem;color:var(--text-faint);margin-top:4px;font-family:'JetBrains Mono',monospace;opacity:0;transition:opacity .3s .1s}
.drop-area.has-file .drop-fsize{opacity:1}
.drop-input{display:none}

/* OUTPUT */
.out-area{flex:1;min-height:220px;position:relative}
.out-text{width:100%;height:100%;background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.72rem;padding:18px;resize:none;outline:none;line-height:1.6}
.out-text::placeholder{color:var(--text-faint)}
.out-text::selection{background:rgba(124,92,252,.25)}
.out-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:12px;transition:opacity .3s}
.out-empty.hidden{opacity:0;pointer-events:none}
.out-empty-icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.02);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center}
.out-empty-icon svg{width:22px;height:22px;stroke:var(--text-faint);fill:none;stroke-width:1.5}
.out-empty span{font-size:.8rem;color:var(--text-faint);font-weight:500}

/* COMPARISON BAR */
.compare{display:none;padding:12px 18px;border-top:1px solid var(--border);background:var(--surface2);flex-shrink:0;gap:16px;align-items:center;justify-content:center}
.compare.active{display:flex}
.compare-item{text-align:center;min-width:80px}
.compare-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-faint);margin-bottom:3px}
.compare-val{font-size:.82rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.compare-val.before{color:var(--text-dim)}
.compare-val.after{color:var(--green2)}
.compare-arrow{font-size:1.1rem;color:var(--accent2);animation:arrowPulse 1.5s ease-in-out infinite}
@keyframes arrowPulse{0%,100%{opacity:.4;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}
.compare-ratio{font-size:.72rem;font-weight:700;color:var(--amber);background:rgba(245,158,11,.08);padding:3px 10px;border-radius:20px;border:1px solid rgba(245,158,11,.15)}

/* BUTTONS */
.actions{display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 28px;border:none;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);display:inline-flex;align-items:center;gap:8px;letter-spacing:-.2px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);opacity:0;transition:opacity .2s}
.btn:hover::before{opacity:1}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:linear-gradient(135deg,var(--accent),#9b5de5);color:#fff;box-shadow:0 4px 24px var(--accent-glow),0 0 0 1px rgba(255,255,255,.1) inset}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px var(--accent-glow),0 0 0 1px rgba(255,255,255,.15) inset}
.btn-primary:active{transform:translateY(0);box-shadow:0 2px 12px var(--accent-glow)}
.btn-primary.loading{pointer-events:none;opacity:.7}
.btn-secondary{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);backdrop-filter:blur(10px)}
.btn-secondary:hover{border-color:var(--border-hi);color:var(--text);transform:translateY(-1px)}
.btn-green{background:rgba(16,185,129,.1);color:var(--green2);border:1px solid rgba(16,185,129,.2)}
.btn-green:hover{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.35);transform:translateY(-1px)}
.btn-red{background:rgba(244,63,94,.06);color:var(--red);border:1px solid rgba(244,63,94,.12)}
.btn-red:hover{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.25);transform:translateY(-1px)}

/* STATUS */
.status{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;min-height:28px}
.stat{font-size:.68rem;font-weight:500;color:var(--text-faint);display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace}
.stat b{color:var(--text-dim);font-weight:600}
.msg{font-size:.78rem;font-weight:600;text-align:center;min-height:22px;margin-top:6px;transition:all .3s;opacity:0;transform:translateY(4px)}
.msg.show{opacity:1;transform:translateY(0)}
.msg.success{color:var(--green2)}
.msg.error{color:var(--red)}
.msg.info{color:var(--accent2)}

/* TOAST */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:10px;animation:toastIn .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(20px);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.toast.out{animation:toastOut .3s cubic-bezier(.4,0,.2,1) forwards}
.toast-success{background:rgba(16,185,129,.12);color:var(--green2);border-color:rgba(16,185,129,.2)}
.toast-error{background:rgba(244,63,94,.1);color:var(--red);border-color:rgba(244,63,94,.15)}
.toast-info{background:rgba(124,92,252,.1);color:var(--accent2);border-color:rgba(124,92,252,.15)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.12)}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.panel{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both}
.panel:nth-child(2){animation-delay:.1s}

.actions{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both;animation-delay:.15s}
.status{animation:fadeUp .45s cubic-bezier(.4,0,.2,1) both;animation-delay:.2s}
.header{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both}

/* RESPONSIVE */
@media(max-width:860px){
  .app{padding:16px}
  .main{grid-template-columns:1fr}
  .panel{min-height:260px}
  h1{font-size:1.4rem}
  .orb-1,.orb-2{width:300px;height:300px}
  .compare{flex-wrap:wrap;gap:10px}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="toast-container" id="toasts"></div>

<div class="processing" id="overlay">
  <div class="spinner"></div>
  <div class="processing-text">Obfuscating...</div>
  <div class="processing-steps" id="procSteps"></div>
</div>

<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">TS</div>
      <h1><span class="grad">TypeScript Obfuscator</span></h1>
    </div>
    <p class="tagline">Drop a .ts file &mdash; get back a heavily obfuscated single-line result</p>
  </div>

  <div class="main">
    <div class="panel">
      <div class="panel-head">
        <div class="panel-label"><span class="panel-dot" id="inDot"></span>Input</div>
        <div class="panel-meta" id="inCnt">No file</div>
      </div>
      <div class="drop-area" id="dropZone">
        <input type="file" id="fileInput" class="drop-input" accept=".js,.ts,.jsx,.tsx,.mjs,.cjs,.txt">
        <div class="drop-border"></div>
        <div class="drop-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="drop-label">Drop your file here</div>
        <div class="drop-sub">or click to browse</div>
        <div class="drop-fname" id="fileName"></div>
        <div class="drop-fsize" id="fileSize"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="panel-label"><span class="panel-dot" id="outDot"></span>Output</div>
        <div class="panel-meta" id="outCnt">0 chars</div>
      </div>
      <div class="out-area">
        <div class="out-empty" id="outEmpty">
          <div class="out-empty-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </div>
          <span>Obfuscated code appears here</span>
        </div>
        <textarea class="out-text" id="out" readonly spellcheck="false"></textarea>
      </div>
      <div class="compare" id="compare">
        <div class="compare-item"><div class="compare-label">Before</div><div class="compare-val before" id="cmpBefore">-</div></div>
        <div class="compare-arrow">&rarr;</div>
        <div class="compare-item"><div class="compare-label">After</div><div class="compare-val after" id="cmpAfter">-</div></div>
        <div class="compare-ratio" id="cmpRatio">-</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="bGo">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Obfuscate
    </button>
    <button class="btn btn-secondary" id="bCp">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>
    <button class="btn btn-green" id="bDl">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download .ts
    </button>
    <button class="btn btn-red" id="bCl">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Clear
    </button>
  </div>

  <div class="status">
    <div class="stat" id="stats"></div>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
/* PARTICLE BG */
(function(){
const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
let W,H,particles=[];
function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
class P{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.r=Math.random()*1.2+.3;this.a=Math.random()*.3+.05}
  update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W)this.vx*=-1;if(this.y<0||this.y>H)this.vy*=-1}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle='rgba(124,92,252,'+this.a+')';ctx.fill()}
}
for(let i=0;i<60;i++)particles.push(new P());
function loop(){
  ctx.clearRect(0,0,W,H);
  particles.forEach(p=>{p.update();p.draw()});
  for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
    const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<150){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle='rgba(124,92,252,'+(0.03*(1-d/150))+')';ctx.lineWidth=.5;ctx.stroke()}
  }
  requestAnimationFrame(loop);
}
loop();
})();

/* TOAST */
function toast(text,type){
const el=document.createElement('div');el.className='toast toast-'+type;el.textContent=text;
document.getElementById('toasts').appendChild(el);
setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},2500);
}

/* MAIN APP */
(function(){
const $=s=>document.getElementById(s);
const out=$('out'),stats=$('stats'),msg=$('msg');
const dropZone=$('dropZone'),fileInput=$('fileInput');
const inDot=$('inDot'),outDot=$('outDot'),outEmpty=$('outEmpty');
const compare=$('compare'),overlay=$('overlay'),procSteps=$('procSteps');
let fileContent='';

/* PARTICLES */
dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-over');if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',e=>{if(e.target.files.length)loadFile(e.target.files[0])});

function loadFile(f){
const reader=new FileReader();
reader.onload=ev=>{
fileContent=ev.target.result;
$('inCnt').textContent=f.name;
$('fileName').textContent=f.name;
$('fileSize').textContent=fileContent.length.toLocaleString()+' characters';
dropZone.classList.add('has-file');
inDot.classList.add('on');
toast('File loaded: '+f.name,'success');
};

function hexId(){return'_'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6)}

function base64Enc(s){

let r='';for(let i=0;i<bytes.length;i+=3){
const b1=bytes[i];const b2=i+1<bytes.length?bytes[i+1]:0;const b3=i+2<bytes.length?bytes[i+2]:0;
r+=chars.charAt(b1>>2);r+=chars.charAt(((b1&3)<<4)|(b2>>4));
r+=(i+1<bytes.length)?chars.charAt(((b2&15)<<2)|(b3>>6)):'=';r+=(i+2<bytes.length)?chars.charAt(b3&63):'=';}return r;
}

for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}

}

const fns=[];let fm;while((fm=funcPat.exec(code))!==null)fns.push({name:fm[1],pos:fm.index});

function runObf(){
const src=fileContent.trim();
if(!src){toast('Drop a file first','error');showMsg('Drop a file first','error');return}

$('bGo').classList.add('loading');

const steps=['Initializing passes...','Scanning strings...','Building string array...','Encoding base64 blobs...','Injecting dead code...','Generating control flow...','Scrambling identifiers...','Wrapping IIFE...','Minifying to single line...','Done!'];
let si=0;
const stepTimer=setInterval(()=>{
if(si<steps.length){procSteps.textContent=steps[si];si++}
},120);

setTimeout(()=>{
try{
let code=src;const srcLen=code.length;
const passes=[];

{passes.push('Dead Code');code=addDeadCode()+'\n'+code;code=code+'\n'+addDeadCode()}
{passes.push('Delays');code=addDelayLoops()+'\n'+code;code=code+'\n'+addDelayLoops()}
{passes.push('Junk Classes');code=addJunkClasses()+'\n'+code;code=code+'\n'+addJunkClasses()}
{passes.push('Debug Traps');code=addDebugTraps()+'\n'+code}

for(let i=0;i<2;i++){code=generateControlFlow()+'\n'+code}

code=injectMemoryTricks()+'\n'+code;
code=wrapWithSymbolObfuscation(code);
passes.push('Hex Variables');
code=hexId()+'(this);'+code;
code=scrambleFunctions(code);
code=scrambleVariableNames(code);
code=scrambleOperators(code);
code=wrapIIFE(code);
code=code.replace(/[\r\n]+/g,' ').replace(/\s{2,}/g,' ').replace(/\s*;\s*/g,';').replace(/\s*\{\s*/g,'{').replace(/\s*\}\s*/g,'}').replace(/\s*\(\s*/g,'(').replace(/\s*\)\s*/g,')').replace(/\s*,\s*/g,',').replace(/\s*;\s*;/g,';').replace(/^\s*;|;\s*$/g,'').trim();
out.value=code;out.dispatchEvent(new Event('input'));

$('cmpAfter').textContent=formatSize(code.length);
$('cmpRatio').textContent=Math.round(code.length/srcLen*10)/10+'x larger';

}catch(e){showMsg('Error: '+e.message,'error');toast('Obfuscation failed','error');console.error(e)}

clearInterval(stepTimer);
setTimeout(()=>{overlay.classList.remove('active');$('bGo').classList.remove('loading')},400);
}
},100);
}
